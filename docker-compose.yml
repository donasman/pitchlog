services:
  postgres:
    image: postgres:16-alpine
    container_name: pitchlog-postgres
    environment:
      POSTGRES_DB: pitchlog
      POSTGRES_USER: pitchlog
      POSTGRES_PASSWORD: pitchlog
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitchlog -d pitchlog"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
