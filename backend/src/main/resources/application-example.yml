spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/pitchlog
    username: pitchlog
    password: pitchlog

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

api-football:
  api-key: 여기에_API_Football_키_입력

logging:
  level:
    com.pitchlog: DEBUG
    org.hibernate.SQL: DEBUG
