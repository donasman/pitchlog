spring:
  application:
    name: pitchlog-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pitchlog}
    username: ${DATABASE_USERNAME:pitchlog}
    password: ${DATABASE_PASSWORD:pitchlog}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_batch_fetch_size: 100

  batch:
    job:
      enabled: false   # 배치 잡 자동 실행 비활성화 (수동 트리거)
    jdbc:
      initialize-schema: always

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

# 외부 API 설정 (배치 전용)
api-football:
  base-url: https://v3.football.api-sports.io
  api-key: ${API_FOOTBALL_KEY:}

# 어드민 인증 (JWT)
admin:
  jwt:
    secret: ${ADMIN_JWT_SECRET:pitchlog-dev-secret-key-must-change-in-prod}
    expiry-hours: 24

logging:
  level:
    com.pitchlog: DEBUG
    org.springframework.batch: INFO
