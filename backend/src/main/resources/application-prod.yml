# 프로덕션 환경 설정 (Railway)
# 민감 정보는 모두 환경변수로 주입

spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update     # 최초 배포 시 테이블 자동 생성 — 배치 완료 후 validate로 복구
    defer-datasource-initialization: true

  sql:
    init:
      mode: always          # schema.sql을 매 기동 시 실행 (CREATE TABLE IF NOT EXISTS 이므로 멱등)
      platform: postgresql

  # Railway PostgreSQL — DATABASE_URL 환경변수 자동 주입
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}

server:
  port: ${PORT:8080}   # Railway가 PORT 환경변수로 포트 전달

# CORS — 프로덕션 도메인만 허용
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://pitchlog.com}

logging:
  level:
    com.pitchlog: INFO
    org.springframework.batch: WARN
    org.hibernate: WARN
